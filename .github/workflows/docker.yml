name: Docker
# Tests en cada push y PR. Al publicar un Release, construye la imagen para x64 y ARM64
# y la sube a Docker Hub como emapupi/mu-linux-browser:<versión> y :latest.
# Secrets necesarios en el repo: DOCKERHUB_USERNAME y DOCKERHUB_TOKEN (un access token de Docker Hub).
on:
  push:
    branches: [ "main" ]
  pull_request:
  release:
    types: [ published ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: docker-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
env:
  IMAGE: emapupi/mu-linux-browser

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - name: Construir la imagen de tests
        uses: docker/build-push-action@v6
        with:
          context: Mu-Browser
          target: test
          load: true
          tags: mu-browser-test
      - name: PHPUnit
        run: docker run --rm mu-browser-test

  publish:
    needs: test
    if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Etiquetas
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.event_name == 'release' }}
            type=sha,enable=${{ github.event_name == 'workflow_dispatch' }}
      - name: Construir y publicar (x64 y ARM64)
        uses: docker/build-push-action@v6
        with:
          context: Mu-Browser
          target: app
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
