# Correr desde la imagen publicada en Docker Hub, sin compilar nada (x64 o ARM64):
#   docker compose -f docker-compose.images.yml up -d
# Igual que docker-compose.yml: todo tiene un valor por defecto y el .env es opcional.
# Para fijar una versión, cambiar :latest por el número del Release (por ejemplo :1.0.0).
services:
  mysql:
    image: mysql:8.4.11
    restart: unless-stopped
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--skip-name-resolve"]
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-mu_browser_root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-mubrowser}
      MYSQL_USER: ${MYSQL_USER:-mu_browser}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-mu_browser}
    volumes:
      - mu_browser_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p$$MYSQL_ROOT_PASSWORD"]
      interval: 5s
      timeout: 3s
      retries: 20

  mu-web:
    image: emapupi/mu-linux-browser:${MU_BROWSER_VERSION:-latest}
    restart: unless-stopped
    environment:
      DB_HOST: ${DB_HOST:-mysql}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:-${MYSQL_USER:-mu_browser}}
      DB_PASS: ${DB_PASS:-${MYSQL_PASSWORD:-mu_browser}}
      DB_NAME: ${DB_NAME:-${MYSQL_DATABASE:-mubrowser}}
      SESSION_SECRET: ${SESSION_SECRET:-}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      TZ: ${TZ:-UTC}
      TIMEZONE: ${TIMEZONE:-UTC}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - mu_browser_sessions:/var/lib/php/sessions
      - mu_browser_uploads:/var/www/app/public/uploads
      - mu_browser_state:/var/lib/mu-browser
    ports:
      - "${WEB_PORT:-8086}:8080"

volumes:
  mu_browser_mysql:
  mu_browser_sessions:
  mu_browser_uploads:
  mu_browser_state:
