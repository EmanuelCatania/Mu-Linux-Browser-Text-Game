ServerName localhost
<VirtualHost *:8080>
    DocumentRoot /var/www/app/public
    <Directory /var/www/app/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    <Directory /var/www/app/public/assets>
        FallbackResource disabled
        Header set Cache-Control "public, max-age=86400"
    </Directory>
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "same-origin"
    # Sólo se ejecutan scripts propios (ninguna plantilla tiene scripts en línea): un texto inyectado no corre.
    # Los estilos en línea quedan permitidos porque las plantillas usan style="" para barras y posiciones.
    Header always set Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
    Header always set Permissions-Policy "camera=(), microphone=(), geolocation=()"
    # Lo subido desde el panel son imágenes: nunca se interpreta como código
    <Directory /var/www/app/public/uploads>
        FallbackResource disabled
        php_admin_flag engine off
        Options -ExecCGI
    </Directory>
    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
